services:
  - type: web
    name: omnistudy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OMNISTUDY_SECRET_KEY
        generateValue: true
    disk:
      name: omnistudy-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
