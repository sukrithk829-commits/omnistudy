{% extends 'base.html' %}
{% block title %}Request access · OmniStudy{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl py-4"><section class="surface overflow-hidden"><div class="bg-gradient-to-r from-indigo-700 to-violet-700 px-6 py-8 text-white sm:px-9"><p class="text-xs font-bold uppercase tracking-[.16em] text-indigo-200">OmniStudy access</p><h1 class="mt-2 text-3xl font-bold">Join your academic network.</h1><p class="mt-2 max-w-xl text-sm leading-6 text-indigo-100">Request an account and an administrator will verify your membership before you can access materials.</p></div><form method="post" class="space-y-5 p-6 sm:p-9"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="grid gap-5 sm:grid-cols-2"><label class="field-label sm:col-span-2">Full name<input required name="name" placeholder="Your full name" class="field-input mt-2"></label><label class="field-label">Institution email<input required name="email" type="email" placeholder="you@college.edu" class="field-input mt-2"></label><label class="field-label">Password<input required name="password" type="password" minlength="8" placeholder="At least 8 characters" class="field-input mt-2"></label><label class="field-label">Role<select name="role" class="field-input mt-2"><option value="student">Student</option><option value="staff">Staff</option></select></label><label class="field-label">Semester<input required name="semester" placeholder="e.g. 6" class="field-input mt-2"></label><label class="field-label sm:col-span-2">Department<input required name="department" placeholder="e.g. Computer Science" class="field-input mt-2"></label></div><button class="btn-primary w-full">Submit verification request →</button><p class="text-center text-sm text-slate-500">Already verified? <a class="font-bold text-indigo-600" href="{{ url_for('login') }}">Sign in</a></p></form></section></div>
{% endblock %}
